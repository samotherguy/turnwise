; Turnwise peripheral recorder on the M5Stack Cardputer ADV (ESP32-S3, 8 MB flash, no PSRAM).
[env:cardputer]
platform = espressif32@6.12.0  ; Arduino 2.0.17 on ESP-IDF 4.4: the IDF 5.5 I2S driver returns constant samples from the ADV codec mic
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    crankyoldgit/IRremoteESP8266
    m5stack/M5Cardputer
    m5stack/M5Unified
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
