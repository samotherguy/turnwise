<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="950" viewBox="0 0 1320 950" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4148"/></marker></defs>
<rect width="1320" height="950" fill="#FFFFFF"/>
<rect x="0" y="0" width="14" height="950" fill="#1DB954"/>
<text x="36" y="40" font-size="22" font-weight="700" fill="#1F2328">Turnwise: system architecture</text>
<text x="36" y="64" font-size="13" fill="#57606A">Everything runs on your machines and your tailnet. Only an owner's question sent to Claude leaves it.</text>
<rect x="510" y="100" width="520" height="800" rx="10" fill="#F2FBF5" stroke="#1DB954" stroke-width="1.6"/>
<text x="524" y="122" font-size="14" font-weight="700" fill="#0E7A36">Turnwise machine (GPU)</text>
<text x="524" y="140" font-size="12" fill="#57606A">One Python service, systemd user unit</text>
<rect x="30" y="150" width="220" height="96" rx="8" fill="#EEF4FF" stroke="#6E8FD6" stroke-width="1.6"/>
<text x="140.0" y="187.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3F86">Phone</text>
<text x="140.0" y="204.0" text-anchor="middle" font-size="12" fill="#57606A">Turnwise Android app</text>
<text x="140.0" y="220.0" text-anchor="middle" font-size="12" fill="#57606A">always-on rolling buffer</text>
<rect x="30" y="290" width="220" height="80" rx="8" fill="#EEF4FF" stroke="#6E8FD6" stroke-width="1.6"/>
<text x="140.0" y="327.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3F86">Phone or laptop</text>
<text x="140.0" y="344.0" text-anchor="middle" font-size="12" fill="#57606A">Turnwise web app (PWA)</text>
<rect x="30" y="620" width="220" height="96" rx="8" fill="#EEF4FF" stroke="#6E8FD6" stroke-width="1.6"/>
<text x="140.0" y="657.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3F86">Claude Code</text>
<text x="140.0" y="674.0" text-anchor="middle" font-size="12" fill="#57606A">CLI and skill, on the</text>
<text x="140.0" y="690.0" text-anchor="middle" font-size="12" fill="#57606A">Turnwise machine</text>
<rect x="300" y="150" width="170" height="220" rx="8" fill="#FFF6EE" stroke="#F68B35" stroke-width="1.6"/>
<text x="385.0" y="225.0" text-anchor="middle" font-size="14" font-weight="700" fill="#9A4A12">Tailscale Serve</text>
<text x="385.0" y="242.0" text-anchor="middle" font-size="12" fill="#57606A">HTTPS on :8446</text>
<text x="385.0" y="258.0" text-anchor="middle" font-size="12" fill="#57606A"></text>
<text x="385.0" y="274.0" text-anchor="middle" font-size="12" fill="#57606A">adds the visitor's</text>
<text x="385.0" y="290.0" text-anchor="middle" font-size="12" fill="#57606A">tailnet login to</text>
<text x="385.0" y="306.0" text-anchor="middle" font-size="12" fill="#57606A">every request</text>
<rect x="640" y="160" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="790.0" y="196.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">FastAPI · :8470</text>
<text x="790.0" y="213.0" text-anchor="middle" font-size="12" fill="#57606A">REST API and the web app</text>
<text x="790.0" y="229.0" text-anchor="middle" font-size="12" fill="#57606A">one notes root per tailnet login</text>
<text x="790.0" y="245.0" text-anchor="middle" font-size="12" fill="#57606A">no login header = local = owner</text>
<rect x="530" y="330" width="210" height="330" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="635.0" y="428.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">GPU worker</text>
<text x="635.0" y="445.0" text-anchor="middle" font-size="12" fill="#57606A">one job at a time</text>
<text x="635.0" y="461.0" text-anchor="middle" font-size="12" fill="#57606A"></text>
<text x="635.0" y="477.0" text-anchor="middle" font-size="12" fill="#57606A">1  ffmpeg: mono WAV</text>
<text x="635.0" y="493.0" text-anchor="middle" font-size="12" fill="#57606A">2  DeepFilterNet (CPU)</text>
<text x="635.0" y="509.0" text-anchor="middle" font-size="12" fill="#57606A">3  pyannote: who spoke</text>
<text x="635.0" y="525.0" text-anchor="middle" font-size="12" fill="#57606A">4  Qwen3-ASR + MMS align</text>
<text x="635.0" y="541.0" text-anchor="middle" font-size="12" fill="#57606A">5  match known voices</text>
<text x="635.0" y="557.0" text-anchor="middle" font-size="12" fill="#57606A">6  LLM: Hinglish, English,</text>
<text x="635.0" y="573.0" text-anchor="middle" font-size="12" fill="#57606A">    title, summary, actions</text>
<rect x="810" y="330" width="200" height="170" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="910.0" y="388.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Chat engine</text>
<text x="910.0" y="405.0" text-anchor="middle" font-size="12" fill="#57606A">bge-m3 index per note</text>
<text x="910.0" y="421.0" text-anchor="middle" font-size="12" fill="#57606A">retrieve turns</text>
<text x="910.0" y="437.0" text-anchor="middle" font-size="12" fill="#57606A">answer with citations</text>
<text x="910.0" y="453.0" text-anchor="middle" font-size="12" fill="#57606A">sessions kept</text>
<rect x="640" y="720" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="790.0" y="761.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Notes on disk</text>
<text x="790.0" y="778.0" text-anchor="middle" font-size="12" fill="#57606A">audio, meta, status per note</text>
<text x="790.0" y="794.0" text-anchor="middle" font-size="12" fill="#57606A">transcript.json and .md</text>
<text x="790.0" y="810.0" text-anchor="middle" font-size="12" fill="#57606A">chunks index, chats, voices</text>
<rect x="1080" y="450" width="210" height="390" rx="8" fill="#FFF6EE" stroke="#F68B35" stroke-width="1.6"/>
<text x="1185.0" y="578.0" text-anchor="middle" font-size="14" font-weight="700" fill="#9A4A12">LLM box (optional)</text>
<text x="1185.0" y="595.0" text-anchor="middle" font-size="12" fill="#57606A">Ollama on another</text>
<text x="1185.0" y="611.0" text-anchor="middle" font-size="12" fill="#57606A">machine on the tailnet</text>
<text x="1185.0" y="627.0" text-anchor="middle" font-size="12" fill="#57606A"></text>
<text x="1185.0" y="643.0" text-anchor="middle" font-size="12" fill="#57606A">qwen3.6:35b-a3b</text>
<text x="1185.0" y="659.0" text-anchor="middle" font-size="12" fill="#57606A">bge-m3 embeddings</text>
<text x="1185.0" y="675.0" text-anchor="middle" font-size="12" fill="#57606A"></text>
<text x="1185.0" y="691.0" text-anchor="middle" font-size="12" fill="#57606A">woken by Wake-on-LAN</text>
<text x="1185.0" y="707.0" text-anchor="middle" font-size="12" fill="#57606A">powers itself off</text>
<text x="1185.0" y="723.0" text-anchor="middle" font-size="12" fill="#57606A">when idle</text>
<rect x="1080" y="330" width="210" height="90" rx="8" fill="#FFF1F0" stroke="#E5534B" stroke-width="1.6"/>
<text x="1185.0" y="364.0" text-anchor="middle" font-size="14" font-weight="700" fill="#9A1D17">Anthropic</text>
<text x="1185.0" y="381.0" text-anchor="middle" font-size="12" fill="#57606A">Claude Code headless,</text>
<text x="1185.0" y="397.0" text-anchor="middle" font-size="12" fill="#57606A">owner only</text>
