<text x="1045.0" y="461" text-anchor="middle" font-size="11" fill="#57606A" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">embed,</text>
<text x="1045.0" y="474" text-anchor="middle" font-size="11" fill="#57606A" paint-order="stroke" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round">answer</text>
