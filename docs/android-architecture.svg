<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="920" viewBox="0 0 1320 920" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B4148"/></marker></defs>
<rect width="1320" height="920" fill="#FFFFFF"/>
<rect x="0" y="0" width="14" height="920" fill="#1DB954"/>
<text x="36" y="40" font-size="22" font-weight="700" fill="#1F2328">Turnwise for Android: app architecture</text>
<text x="36" y="64" font-size="13" fill="#57606A">Kotlin and Jetpack Compose, no third-party libraries beyond AndroidX. One foreground service owns the microphone.</text>
<rect x="250" y="100" width="770" height="660" rx="10" fill="#F2FBF5" stroke="#1DB954" stroke-width="1.6"/>
<text x="264" y="122" font-size="14" font-weight="700" fill="#0E7A36">Turnwise Android app</text>
<rect x="270" y="140" width="730" height="170" rx="10" fill="#FFFFFF" stroke="#B7E4C7" stroke-width="1.1"/>
<text x="284" y="162" font-size="14" font-weight="700" fill="#0E7A36">Screens (Compose)</text>
<rect x="270" y="460" width="730" height="280" rx="10" fill="#FFFFFF" stroke="#B7E4C7" stroke-width="1.1"/>
<text x="284" y="482" font-size="14" font-weight="700" fill="#0E7A36">Always-on recorder (foreground service, microphone type)</text>
<rect x="30" y="170" width="190" height="90" rx="8" fill="#EEF4FF" stroke="#6E8FD6" stroke-width="1.6"/>
<text x="125.0" y="204.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3F86">You, in the app</text>
<text x="125.0" y="221.0" text-anchor="middle" font-size="12" fill="#57606A">five tabs and the</text>
<text x="125.0" y="237.0" text-anchor="middle" font-size="12" fill="#57606A">screens they open</text>
<rect x="30" y="492" width="190" height="96" rx="8" fill="#EEF4FF" stroke="#6E8FD6" stroke-width="1.6"/>
<text x="125.0" y="529.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3F86">You, outside it</text>
<text x="125.0" y="546.0" text-anchor="middle" font-size="12" fill="#57606A">home-screen widget,</text>
<text x="125.0" y="562.0" text-anchor="middle" font-size="12" fill="#57606A">notification buttons</text>
<rect x="285" y="175" width="128" height="74" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="349.0" y="201.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Notes</text>
<text x="349.0" y="218.0" text-anchor="middle" font-size="12" fill="#57606A">list, search,</text>
<text x="349.0" y="234.0" text-anchor="middle" font-size="12" fill="#57606A">note, transcript</text>
<rect x="428" y="175" width="128" height="74" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="492.0" y="201.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Ask</text>
<text x="492.0" y="218.0" text-anchor="middle" font-size="12" fill="#57606A">chats with</text>
<text x="492.0" y="234.0" text-anchor="middle" font-size="12" fill="#57606A">cited sources</text>
<rect x="571" y="175" width="128" height="74" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="635.0" y="201.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Listen</text>
<text x="635.0" y="218.0" text-anchor="middle" font-size="12" fill="#57606A">loudness wave,</text>
<text x="635.0" y="234.0" text-anchor="middle" font-size="12" fill="#57606A">pick a moment</text>
<rect x="714" y="175" width="128" height="74" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="778.0" y="201.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Clips</text>
<text x="778.0" y="218.0" text-anchor="middle" font-size="12" fill="#57606A">saved clips,</text>
<text x="778.0" y="234.0" text-anchor="middle" font-size="12" fill="#57606A">send, share</text>
<rect x="857" y="175" width="128" height="74" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="921.0" y="201.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Settings</text>
<text x="921.0" y="218.0" text-anchor="middle" font-size="12" fill="#57606A">window, server,</text>
<text x="921.0" y="234.0" text-anchor="middle" font-size="12" fill="#57606A">voices</text>
<rect x="285" y="258" width="700" height="40" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="635.0" y="282.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">Shell: tabs, back stack, mini player, Blip and Bolt</text>
<rect x="285" y="340" width="330" height="90" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="450.0" y="374.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">PreviewPlayer</text>
<text x="450.0" y="391.0" text-anchor="middle" font-size="12" fill="#57606A">one MediaPlayer for previews, clips and</text>
<text x="450.0" y="407.0" text-anchor="middle" font-size="12" fill="#57606A">note audio streamed from the server</text>
<rect x="655" y="340" width="345" height="90" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="827.5" y="374.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Api client</text>
<text x="827.5" y="391.0" text-anchor="middle" font-size="12" fill="#57606A">notes, chats, settings, uploads</text>
<text x="827.5" y="407.0" text-anchor="middle" font-size="12" fill="#57606A">HttpURLConnection, org.json, 20 s cap</text>
<rect x="285" y="500" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="351.0" y="529.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Widget and</text>
<text x="351.0" y="546.0" text-anchor="middle" font-size="12" fill="#57606A">notification:</text>
<text x="351.0" y="562.0" text-anchor="middle" font-size="12" fill="#57606A">start, stop,</text>
<text x="351.0" y="578.0" text-anchor="middle" font-size="12" fill="#57606A">send last 15 min</text>
<rect x="427" y="500" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="493.0" y="536.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">RecorderService</text>
<text x="493.0" y="553.5" text-anchor="middle" font-size="12" fill="#57606A">foreground,</text>
<text x="493.0" y="569.5" text-anchor="middle" font-size="12" fill="#57606A">restarts itself</text>
<rect x="569" y="500" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="635.0" y="536.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2328">RecordingEngine</text>
<text x="635.0" y="553.5" text-anchor="middle" font-size="12" fill="#57606A">AudioRecord</text>
<text x="635.0" y="569.5" text-anchor="middle" font-size="12" fill="#57606A">16 kHz mono</text>
<rect x="711" y="500" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="777.0" y="537.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">ChunkWriter</text>
<text x="777.0" y="554.0" text-anchor="middle" font-size="12" fill="#57606A">30 s AAC .m4a</text>
<text x="777.0" y="570.0" text-anchor="middle" font-size="12" fill="#57606A">+ loudness/sec</text>
<rect x="853" y="500" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="919.0" y="529.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">ChunkStore</text>
<text x="919.0" y="546.0" text-anchor="middle" font-size="12" fill="#57606A">keeps the last</text>
<text x="919.0" y="562.0" text-anchor="middle" font-size="12" fill="#57606A">N hours, pins</text>
<text x="919.0" y="578.0" text-anchor="middle" font-size="12" fill="#57606A">what is in use</text>
<rect x="853" y="640" width="132" height="86" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="919.0" y="672.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">ClipExporter</text>
<text x="919.0" y="689.0" text-anchor="middle" font-size="12" fill="#57606A">joins chunks,</text>
<text x="919.0" y="705.0" text-anchor="middle" font-size="12" fill="#57606A">no re-encoding</text>
<rect x="1080" y="330" width="210" height="110" rx="8" fill="#FFF6EE" stroke="#F68B35" stroke-width="1.6"/>
<text x="1185.0" y="366.0" text-anchor="middle" font-size="14" font-weight="700" fill="#9A4A12">Turnwise server</text>
<text x="1185.0" y="383.0" text-anchor="middle" font-size="12" fill="#57606A">over Tailscale, HTTPS</text>
<text x="1185.0" y="399.0" text-anchor="middle" font-size="12" fill="#57606A">the same API as the</text>
<text x="1185.0" y="415.0" text-anchor="middle" font-size="12" fill="#57606A">web app</text>
<rect x="270" y="810" width="730" height="70" rx="8" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.1"/>
<text x="635.0" y="842.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2328">Android platform</text>
<text x="635.0" y="859.0" text-anchor="middle" font-size="12" fill="#57606A">AudioRecord · MediaCodec · MediaMuxer · MediaStore (Recordings) · MediaPlayer</text>
